name: Go CI
on:
  push:
  pull_request:
jobs:
  test:
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Check WSL launcher and Docker Compose configuration
        run: |
          bash -n run.sh
          docker compose --profile test config -q
      - name: Verify committed dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format and export changed Go files for commit
        run: |
          gofmt -w cmd/worker/main.go cmd/worker/main_test.go internal/health/worker.go internal/health/worker_test.go cmd/healthcheck/main.go internal/httpapi/server.go internal/integration/integration_test.go internal/operations/idempotency/idempotency_integration_test.go internal/httpapi/readiness_test.go
          for path in cmd/worker/main.go cmd/worker/main_test.go internal/health/worker.go internal/health/worker_test.go cmd/healthcheck/main.go internal/httpapi/server.go internal/integration/integration_test.go internal/operations/idempotency/idempotency_integration_test.go internal/httpapi/readiness_test.go; do
            printf 'FORMATTED_START:%s:' "$path"
            base64 -w0 "$path"
            printf ':FORMATTED_END\\n'
          done
      - name: Verify Go formatting
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -type f))"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Full unit and Redis integration suite
        env:
          REDIS_TEST_ADDR: 127.0.0.1:6379
        run: go test -mod=readonly -race -tags=integration -count=1 ./...
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Build
        run: go build -mod=readonly ./cmd/api ./cmd/worker ./cmd/healthcheck
      - name: Docker image smoke build
        run: docker build -t go-async-jobs:ci .
